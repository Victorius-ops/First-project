<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Каталог Игр</h1>
    <div class="cardCreate">
        <form class="addGame">
            <label for="Name">Название:</label>
            <input type="text" name="name" placeholder="Assasins`creed 2">
            <label for="Genre">Жанр:</label>
            <input type="text" name="genre" placeholder="Actions">
            <label for="Price">Цена:</label>
            <input type="number" name="price" placeholder="400P">
            <label for="Platform">Платформа:</label>
            <select title="Ptatforms" name="Ptatforms" id="идентификатор">
                    <option value="PC" selected="selected">PC</option>
                    <option value="Xbox">Xbox</option>
                    <option value="PS">Playstation</option>
                    </select>
            <label for="Rating">Рейтинг:</label>
            <input type="number" name="rating" placeholder="8.8">
            <label for="Year">Год выхода:</label>
            <input type="number" name="year" placeholder="2007">
            <label for="Description">Описание:</label>
            <input type="text"  name="description" placeholder="-">
            <button class="addBTN" type="submit">Добавьте игру</button>
        </form>
    </div>
    <div class="searchGames">
        <span>Найти игру</span>
        <input type="text" placeholder="Укажите название">
    </div>
    <div class="categoryFilter">
        <button id="Action">Action</button>
        <button id="LiveSim">LiveSim</button>
        <button id="Race">Race</button>
        <button id="Survivor">Survivor</button>
    </div>
    <div class="greateFilter">   
        Фильтр   
        Название<input type="text" placeholder="-">
        Цена<input type="text" placeholder="-">
        Рейтинг<input type="text" placeholder="-">
        Год выхода<input type="text" placeholder="-">
    </div>
    
        <button class="DelAll">Удалить все игры</button>
        <button class="RestoreSTD">Восстановить стандартный список</button>
        <div class="cardsArea"></div>
        <div class="MSG"></div>
    </div>
    <div class="stats">Статитстика игр где показывается информация по текущим играм: сколько всего игр, сколько избранных, средняя цена, средний рейтинг</div>
    <div class="API">
        <button class="fetch">Запрос к API</button> 
    </div>
    <div class="rates">
       <div>Отзывы</div> 
       <button class="reloadExternal">Обновить</button>
       <div class="reload"></div>
    </div>
    <div class="timer">  
        <h2>
            <span class="Timer">Вы просматриваете сайт: 00:00:00</span>
        </h2>
    </div>
    <script type="module" src="data.js"></script>
    <script type="module" src="Game.js"></script>
    <script type="module" src="UI.js"></script>
    <script type="module" src="app.js"></script>
    <scrip type="module" src="storage.js" ></script>
    <script type="module" src="api.js"></script>
</body>
</html>
