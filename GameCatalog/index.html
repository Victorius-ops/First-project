<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Каталог Игр</h1>
    <div class="cardCreate">
        <form class="addGame" action="">
            <span>Название:</span><input type="text">
            <span>Жанр:</span><input type="text">
            <span>Цена:</span><input type="text">
            <span>Платформа:</span><select name="Ptatforms" id="идентификатор">
                    <option value="PC">PC</option>
                    <option value="Console1">Xbox</option>
                    <option value="Console2">Playstation</option>
                    </select>
            <span>Рейтинг:</span><input type="number">
            <span>Год выхода:</span><input type="number">
            <span>Описание:</span><input type="text">
            <button class="addBTN" type="submit">Добавьте игру</button>
        </form>
    </div>
    <div class="searchGames">
        <span>Найти игру</span>
        <input type="text">
    </div>
    <div class="categoryFilter">
        <button>Action</button>
        <button>LiveSim</button>
        <button>Race</button>
        <button>Survivor</button>
    </div>
    <div class="greateFilter">   
        Фильтр   
    </div>
    <div class="cardsArea">
        Зона с карточками
    </div>
    <script type="module" src="data.js"></script>
    <script type="module" src="Game.js"></script>
</body>
</html>
