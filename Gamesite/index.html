<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <div class="hero-name">Имя героя</div>
        <div class="hero-class">Класс героя</div>
        <div class="hero-hp">Здоровье героя</div>
        <div class="hero-level">Уровень героя</div>
        <div class="hero-coins">Золото героя</div>
    </div>
    <input class="name-input" type="text" placeholder="Новое имя">
    <button class="change-name-btn">Сохранить имя</button>
    <button class="damage-btn">Получить урон</button>
    <button class="heal-btn">Вылечить героя</button>
    <button class="level-up-btn">Поднять уровень</button>
    <button class="coins-btn">Получить монеты</button>
    <button class="theme-btn">Сменить тему</button>
    <div class="message">Alert</div>
</body>
</html>
